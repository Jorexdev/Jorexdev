<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur">
        <animate attributeName="stdDeviation" values="0.5;1.5;0.5" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feColorMatrix type="matrix" in="blur" values="0 0 0 0 0.933  0 0 0 0 0.114  0 0 0 0 0.322  0 0 0 1.2 0" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="data:image/png;base64," x="2" y="2" width="46" height="46" filter="url(#glow)"/>
</svg>
