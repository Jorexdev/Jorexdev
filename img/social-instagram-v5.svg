<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <defs>
    <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fcaf45"/>
      <stop offset="25%"  stop-color="#f77737"/>
      <stop offset="50%"  stop-color="#fd1d1d"/>
      <stop offset="75%"  stop-color="#c13584"/>
      <stop offset="100%" stop-color="#405de6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur">
        <animate attributeName="stdDeviation" values="0.3;1.2;0.3" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feColorMatrix type="matrix" in="blur" values="0 0 0 0 0.882  0 0 0 0 0.188  0 0 0 0 0.424  0 0 0 1 0" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="50" height="50" rx="11" ry="11" fill="url(#ig)" filter="url(#glow)"/>
  <rect x="9" y="12" width="32" height="26" rx="6" ry="6" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="25" cy="25" r="7.5" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="35" cy="16" r="2.2" fill="white"/>
</svg>
