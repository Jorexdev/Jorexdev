<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="160" viewBox="0 0 900 160">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="2;9;2" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="450" y="68" font-family="'DM Sans', sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0">Aprende backend
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>
  <image href="data:image/png;base64," x="715" y="28" width="90" height="54" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </image>
  <text x="450" y="122" font-family="'DM Sans', sans-serif" font-size="46" font-weight="700" fill="#A3B067" filter="url(#glow)" text-anchor="middle" opacity="0">GRATIS
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
  </text>
</svg>
