<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
  <defs>
    <filter id="glow-s" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="1.5;5;1.5" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="450" y="24" font-family="'DM Sans', sans-serif" font-size="17" fill="#CCCCCC" text-anchor="middle">Encuentra tu próximo</text>
  <text x="450" y="52" font-family="'DM Sans', sans-serif" font-size="17" font-style="italic" fill="#A3B067" filter="url(#glow-s)" text-anchor="middle">trabajo tech</text>
  <text x="450" y="80" font-family="'DM Sans', sans-serif" font-size="17" fill="#CCCCCC" text-anchor="middle">a través de proyectos reales.</text>
  <text x="450" y="112" font-family="'DM Sans', sans-serif" font-size="17" fill="#CCCCCC" text-anchor="middle">Conectamos empresas con talento emergente,</text>
  <text x="450" y="138" font-family="'DM Sans', sans-serif" font-size="17" fill="#CCCCCC" text-anchor="middle">aprende, trabaja en equipo y crece.</text>
</svg>
