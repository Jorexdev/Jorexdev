<svg xmlns="http://www.w3.org/2000/svg" width="200" height="44" viewBox="0 0 200 44">
  <defs>
    <filter id="glow-btn" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="3;7;3" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="200" height="44" rx="0" ry="0" fill="#A3B067" filter="url(#glow-btn)"/>
  <text x="100" y="28" font-family="'DM Sans', sans-serif" font-size="15" font-weight="600" fill="#F5F0E4" text-anchor="middle" letter-spacing="0.5">Ver Recursos</text>
</svg>
