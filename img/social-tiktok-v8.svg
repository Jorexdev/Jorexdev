<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur">
        <animate attributeName="stdDeviation" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feColorMatrix type="matrix" in="blur" values="0 0 0 0 0.933  0 0 0 0 0.114  0 0 0 0 0.322  0 0 0 0.8 0" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="data:image/png;base64," width="50" height="50" filter="url(#glow)"/>
</svg>
