<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="2;9;2" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Sans:wght@400;700&amp;display=swap');
    .tag    { font-family: 'DM Mono', monospace; font-size: 13px; fill: #A3B067; letter-spacing: 0.12em; }
    .normal { font-family: 'DM Sans', sans-serif; font-size: 46px; font-weight: 700; fill: #ffffff; }
    .accent { font-family: 'DM Sans', sans-serif; font-size: 46px; font-weight: 700; fill: #A3B067; }
  </style>
  <rect width="900" height="130" fill="transparent"/>

  <text x="450" y="52" text-anchor="middle" opacity="0">
    <tspan class="normal">Hola, soy </tspan><tspan class="accent" filter="url(#glow)">Jorex</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>

  <text x="450" y="100" text-anchor="middle" class="tag" opacity="0">
    // software analyst · divulgador · speaker
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
  </text>
</svg>
