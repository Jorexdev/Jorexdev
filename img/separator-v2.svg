<svg xmlns="http://www.w3.org/2000/svg" width="900" height="32" viewBox="0 0 900 32">
  <defs>
    <filter id="glow-sep" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="wave-grad" x1="-900" y1="0" x2="-450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3B067"/>
      <stop offset="35%" stop-color="#A3B067"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#A3B067"/>
      <stop offset="100%" stop-color="#A3B067"/>
      <animate attributeName="x1" values="-900;900;-900" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-450;1350;-450" dur="2.4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <text x="50" y="22" font-family="'DM Mono', monospace" font-size="13" letter-spacing="0" fill="url(#wave-grad)" filter="url(#glow-sep)">================================================================================</text>
</svg>