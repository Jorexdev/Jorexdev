<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="50" height="50">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur">
        <animate attributeName="stdDeviation" values="0.5;2;0.5" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feColorMatrix type="matrix" in="blur" values="0 0 0 0 0.882  0 0 0 0 0.188  0 0 0 0 0.424  0 0 0 0.8 0" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="14" y="14" width="72" height="72" rx="18" ry="18" fill="none" stroke="white" stroke-width="6"/>
    <circle cx="50" cy="50" r="14" fill="none" stroke="white" stroke-width="6"/>
    <circle cx="74" cy="27" r="5" fill="white"/>
  </g>
</svg>
