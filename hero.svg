<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Sans:wght@400;700&amp;display=swap');
    .tag { font-family: 'DM Mono', monospace; font-size: 13px; fill: #A3B067; letter-spacing: 0.12em; }
    .normal { font-family: 'DM Sans', sans-serif; font-size: 46px; font-weight: 700; fill: #606C38; }
    .accent { font-family: 'DM Sans', sans-serif; font-size: 46px; font-weight: 700; fill: #A3B067; }
  </style>
  <rect width="900" height="130" fill="transparent"/>
  <text x="450" y="52" text-anchor="middle">
    <tspan class="normal">Hola, soy </tspan><tspan class="accent">Jorex</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="450" y="100" text-anchor="middle" class="tag">
    // software analyst · divulgador · speaker
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.5s" fill="freeze"/>
  </text>
</svg>
