<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="2;9;2" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- "Hola, soy " fade in -->
  <text
    x="435" y="68"
    font-family="'DM Sans', sans-serif"
    font-size="46"
    font-weight="700"
    fill="#ffffff"
    opacity="0"
    text-anchor="end"
  >Hola, soy
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>

  <!-- "Jorex" con glow fade in -->
  <text
    x="450" y="68"
    font-family="'DM Sans', sans-serif"
    font-size="46"
    font-weight="700"
    fill="#A3B067"
    filter="url(#glow)"
    opacity="0"
    text-anchor="start"
  >Jorex
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>

  <!-- tag fade in -->
  <text
    x="200" y="106"
    font-family="'DM Mono', monospace"
    font-size="13"
    fill="#A3B067"
    letter-spacing="2"
    opacity="0"
    text-anchor="start"
  >// software analyst · divulgador · speaker
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
  </text>
</svg>
